# 发 NuGet 包：走 Trusted Publishing（OIDC），仓库里不存任何 API key。
#
# nuget.org 侧配一次策略即可（Account → Trusted Publishing）：
#   Repository Owner : yunmoxinghe
#   Repository       : ReactorForUWP
#   Workflow File    : publish.yml        ← 只填文件名，不要带 .github/workflows/
#   Environment      : 留空（本工作流没用 environment）
#
# 仓库侧只需一个 secret：NUGET_USER = nuget.org 的 profile name（不是邮箱）。
#
# 触发方式：
#   - 手动：Actions → publish → Run workflow（可勾 dry-run 只打包不推送）
#   - 打 tag：git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1

name: publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只打包，不推送到 nuget.org
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      # 缺这条 NuGet/login 会直接 403：它是向 GitHub 要 OIDC 令牌的开关。
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 这里**不能**加 -p:Platform=x64：那样包里的托管程序集会被编成 x64 专属
      # （lib\...\Reactor.uwp.dll 的 PE machine 变 0x8664），arm64 消费方引用它
      # 就报 CS8012"引用程序集面向的是另一个处理器"。用默认平台（AnyCPU）打包，
      # 打出来才是纯 IL（0x14c），x64 / arm64 都能引用。
      # 原生桥的两个架构是预编译产物，跟 pack 的平台无关，照样都进包。
      - name: Pack
        run: dotnet pack Reactor.uwp/Reactor.uwp.csproj -c Release -o artifacts

      - name: 列出产物
        run: Get-ChildItem artifacts | Format-Table Name, Length

      # 防回归：arm64 的原生桥曾经漏打过（csproj 里只列了 x64 的打包项），
      # 包照样出、照样能推，只有消费方在 arm64 下才炸。这里直接在 CI 里卡住。
      - name: 校验双架构原生桥都在包里
        shell: pwsh
        run: |
          $pkg = @(Get-ChildItem artifacts\*.nupkg | Where-Object { $_.Extension -eq '.nupkg' })[0]
          $tmp = Join-Path $env:RUNNER_TEMP 'pkgcheck'
          Expand-Archive -Path $pkg.FullName -DestinationPath $tmp -Force
          foreach ($arch in @('win-x64', 'win-arm64')) {
            $p = Join-Path $tmp "runtimes\$arch\native\Reactor.Uwp.Native.dll"
            if (-not (Test-Path $p)) { throw "包里缺 runtimes\$arch\native\Reactor.Uwp.Native.dll" }
            Write-Host "ok  runtimes\$arch\native\Reactor.Uwp.Native.dll"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: nupkg
          path: artifacts/*

      # 临时 key 只有 ~1 小时，所以登录要紧贴 push，不能放在打包前面。
      #
      # dry-run 也照跑登录：一来验证 OIDC 链路通不通，二来私有仓库的策略
      # 初次只有 7 天临时激活期，成功换到一次临时 key 就够把它转成永久，
      # 不必真的推包上去。
      - name: NuGet login（OIDC → 临时 API key）
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # 不能用 artifacts/*.nupkg 一把梭：这里的通配符里 *.nupkg
      # 也会吃进 .snupkg，写两个 glob 就变成同一个符号包推两次，
      # 第二次必然 409。这里按扩展名精确分拣。
      #
      # 另：dotnet nuget push 推 .nupkg 时会自动带上同目录的 .snupkg，
      # 所以日志里符号包那条 Conflict 是预期的（--skip-duplicate 已放行），
      # 不是失败。显式再推一次是为了在自动附带行为变化时也不丢符号包。
      - name: Push
        if: ${{ !inputs.dry-run }}
        shell: pwsh
        run: |
          $nupkg = @(Get-ChildItem artifacts\*.nupkg | Where-Object { $_.Extension -eq '.nupkg' })
          $symbols = @(Get-ChildItem artifacts\*.snupkg -ErrorAction SilentlyContinue)
          $files = $nupkg + $symbols
          if ($files.Count -eq 0) { throw "artifacts 里没有包" }
          dotnet nuget push $files `
            --source https://api.nuget.org/v3/index.json `
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
            --skip-duplicate
